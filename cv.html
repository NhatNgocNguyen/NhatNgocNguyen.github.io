<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"> </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="publications.html" class="nav-link">Publications</a></li>
                <li><a href="cv.html" class="nav-link active">CV</a></li>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </ul>
        </div>
    </nav>

    <main class="container cv-page">
        <section class="page-header">
            <h1 class="page-title">Curriculum Vitae</h1>
            <a href="CV.pdf" class="cv-download" download>Download PDF</a>
        </section>

        <section class="cv-viewer-section">
            <div id="cv-viewer" class="cv-viewer" aria-label="Nhat Nguyen Curriculum Vitae"></div>
            <p id="cv-fallback" class="cv-fallback" hidden>
                If the CV does not appear,
                <a href="CV.pdf" target="_blank" rel="noopener noreferrer">open the PDF</a>
                or download it above.
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Nhat Nguyen. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.querySelector('.theme-icon');
        const html = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeIcon.textContent = theme === 'light' ? '🌙' : '☀️';
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const viewer = document.getElementById('cv-viewer');
        let pdfDoc = null;
        let renderToken = 0;

        async function renderCV() {
            if (!pdfDoc) return;

            const token = ++renderToken;
            const width = viewer.clientWidth || 900;
            const outputScale = window.devicePixelRatio || 1;
            viewer.innerHTML = '';

            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                const page = await pdfDoc.getPage(pageNum);
                if (token !== renderToken) return;

                const unscaled = page.getViewport({ scale: 1 });
                const viewport = page.getViewport({ scale: width / unscaled.width });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d', { alpha: false });

                canvas.className = 'cv-page-canvas';
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = `${Math.floor(viewport.width)}px`;
                canvas.style.height = `${Math.floor(viewport.height)}px`;
                viewer.appendChild(canvas);

                await page.render({
                    canvasContext: context,
                    viewport,
                    transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null
                }).promise;
            }
        }

        pdfjsLib.getDocument('CV.pdf').promise.then((pdf) => {
            pdfDoc = pdf;
            return renderCV();
        }).catch(() => {
            document.getElementById('cv-fallback').hidden = false;
            viewer.innerHTML = '';
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderCV, 150);
        });
    </script>
</body>
</html>
